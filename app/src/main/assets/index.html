<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Maqam Tashreeq Engine — محرك التشريق</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0f14">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0d0f14;--pnl:#161a22;--pnl2:#1e2430;--line:#2a3240;--txt:#e8eaf0;--dim:#8b93a5;--acc:#e0a458;--acc2:#5cc0d6;--red:#c0424c;--grn:#4bbf6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Naskh Arabic",sans-serif;padding:12px;max-width:940px;margin:0 auto}
h1{font-size:18px;margin:0 0 2px}.sub{color:var(--dim);font-size:12px;margin-bottom:12px}
.panel{background:var(--pnl);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px}
.ttl{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--acc)}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}
label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}
select,button,input[type=text]{min-height:44px;touch-action:manipulation;background:var(--pnl2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:14px;font-family:inherit}
.field{flex:1;min-width:140px}
button.primary{background:var(--acc);color:#1a1206;border:none;font-weight:700;padding:14px;font-size:15px;width:100%}
button.ghost{background:var(--pnl2);flex:1}
button.red{background:var(--red);color:#fff;border:none;font-weight:700;flex:1}
.warn{border-radius:11px;padding:11px;font-size:12.5px;margin-bottom:11px;display:none;line-height:1.55}
.warn.show{display:block}
.warn.err{background:#3a1417;border:1px solid var(--red);color:#ffb9be}
.warn.info{background:#12262e;border:1px solid var(--acc2);color:#bfe8f2}
.status{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:8px;margin-top:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}.dot.on{background:var(--grn);box-shadow:0 0 9px var(--grn)}
.mon{direction:ltr;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--acc)}
.mon.idle{font-size:14px;font-weight:500;color:var(--dim)}
.mon .o{font-size:14px;color:var(--acc2);font-weight:500}
.meta{direction:ltr;display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:6px}
.scale{direction:ltr;display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.dg{background:var(--pnl2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11px;text-align:center;min-width:50px}
.dg .n{font-size:13px;font-weight:700}.dg .c{font-size:9.5px;color:var(--dim)}
.dg.qt{border-color:var(--acc);color:var(--acc)}
.note{font-size:11.5px;color:var(--dim);line-height:1.6;margin-top:9px}
.note b{color:var(--txt)}
/* tuner */
.qt{direction:ltr;background:#e8e8e8;border-radius:11px;overflow:hidden;border:1px solid #3a3a3a}
.qh{background:#1e7a3c;color:#fff;font-size:12.5px;font-weight:600;padding:7px 10px;display:flex;justify-content:space-between}
.qb{display:flex;padding:8px;gap:8px;background:#c9c9c9}
.qkb{position:relative;flex:1;height:148px;display:flex}
.qw{touch-action:none;flex:1;background:#fff;border:1px solid #7a7a7a;border-radius:0 0 4px 4px;position:relative;cursor:pointer}
.qw.sel{background:#ffe4bd}
.qk{touch-action:none;position:absolute;top:0;width:9.2%;height:60%;background:#111;border:1px solid #000;border-radius:0 0 3px 3px;z-index:3;transform:translateX(-50%);cursor:pointer}
.qk.sel{background:#8a5200}
.mk{position:absolute;left:15%;right:15%;bottom:5px;height:5px;border-radius:3px;background:#e02020;z-index:4}
.qk .mk{bottom:4px;left:12%;right:12%;background:#ff6a45}
.lb{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:9.5px;color:#666}
.cv{position:absolute;bottom:25px;left:0;right:0;text-align:center;font-size:10px;font-weight:700;color:#c00}
.qk .cv{bottom:auto;top:4px;color:#ffcf9a;font-size:9px}
.qs{width:58px;display:flex;flex-direction:column;gap:6px}
.qs button{background:#d4d4d4;border:1px solid #8a8a8a;color:#222;border-radius:7px;padding:0;font-size:16px;flex:1}
.qr{display:flex;gap:5px;padding:0 8px 8px;background:#c9c9c9}
.qr button{flex:1;background:#9d9d9d;border:1px solid #7a7a7a;color:#111;font-weight:700;font-size:12.5px;padding:10px 0;border-radius:6px}
.qr button.on{background:#2f2f2f;color:#fff}
.qr.fine button{font-size:11px;padding:7px 0;background:#b4b4b4}
.qf{background:#e0e0e0;color:#333;font-size:11px;padding:6px 9px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.qf select,.qf input{background:#fff;color:#111;border:1px solid #999;padding:4px 6px;font-size:11px;border-radius:5px}
.sl{display:flex;align-items:center;gap:9px;margin-top:9px}
.sl input[type=range]{flex:1;accent-color:var(--acc)}
.sl span{font-size:10.5px;color:var(--dim);min-width:82px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.igrid button{min-height:52px;touch-action:manipulation;background:var(--pnl2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:11px 5px;font-size:12px;line-height:1.35}
.igrid button.on{background:var(--acc);color:#1a1206;border-color:var(--acc);font-weight:700}
.igrid button small{display:block;font-size:9.5px;color:var(--dim);margin-top:2px}
.igrid button.on small{color:#5a3a08}
.trbox{direction:ltr;display:flex;gap:7px;align-items:stretch}
.trbox .tb{flex:1;background:var(--pnl2);border:1px solid var(--line);color:var(--txt);font-size:15px;font-weight:700;border-radius:10px;padding:14px 0}
.trbox .tb.z{background:var(--acc);color:#1a1206;border:none;flex:.7}
.trval{flex:1.3;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:var(--acc);background:#0a0c10;border:1px solid var(--line);border-radius:10px;min-width:64px}
.logbox{background:#0a0c10;border:1px solid var(--line);border-radius:9px;padding:9px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;line-height:1.5;color:#c8d0dc;max-height:230px;overflow:auto;white-space:pre-wrap;word-break:break-word;direction:ltr;text-align:left}
.logbox .e{color:#ff8a90}.logbox .w{color:#ffcf7a}.logbox .i{color:#7fd6a0}.logbox .m{color:#8b93a5}
.badge{display:inline-block;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;margin-inline-start:6px}
.sl b{font-size:11px;min-width:38px;text-align:right}
</style>
</head>
<body>
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
<h1 id="h1">محرك التشريق</h1>
<select id="lang" style="min-width:auto;padding:7px 9px"><option value="ar">العربية</option><option value="en">English</option></select>
</div>
<div class="sub" id="sub"></div>

<div class="warn err" id="warn"></div>
<div class="warn err" id="stuck" style="display:none"></div>


<div class="panel" id="platPanel">
  <div class="ttl" id="platT"></div>
  <div class="warn info show" id="platMsg"></div>
</div>
<div class="panel">
  <button class="primary" id="connect"></button>
  <div class="status"><span class="dot" id="dot"></span><span id="msg">اضغط اتصال ثم اختر الأجهزة.</span></div>
  <div class="row" style="margin-top:11px">
    <div class="field"><label id="lIn"></label><select id="inSel"><option value="">—</option></select></div>
    <div class="field"><label id="lOut"></label><select id="outSel"><option value="">—</option></select></div>
  </div>
  <div class="row" style="margin-top:9px">
    <div class="field"><label id="lMode"></label><select id="mode">
      <option value="bend">Pitch-Bend (يعمل مع أغلب الأجهزة)</option>
      <option value="mts">MTS SysEx (داخل محرك الجهاز)</option>
    </select></div>
    <div class="field"><label id="lBR"></label><select id="brange">
      <option value="1">±1</option><option value="2" selected>±2</option><option value="12">±12</option></select></div>
    <div class="field"><label id="lNames"></label><select id="naming">
      <option value="sol">Do Re Mi</option><option value="ar">دو ري مي</option><option value="abc">C D E</option></select></div>
  </div>
</div>


<div class="panel" style="border-color:var(--acc)">
  <div class="ttl" id="ksT"></div>
  <button class="primary" id="bKS"></button>
  <div class="row" style="margin-top:9px">
    <button class="red" id="bRestore" style="padding:14px"><span id="restore"></span></button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="primary" id="bSafeUnplug" style="background:#4bbf6b;color:#06210f"><span id="safeUnplug"></span></button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="ghost" id="bAuto">Auto-restore: ON</button>
    <button class="ghost" id="bResetTune"><span id="resetTune"></span></button>
  </div>
  <div class="warn info show" id="ksinfo" style="margin-top:10px"></div>
</div>
<div class="panel">
  <div class="mon idle" id="mon"></div>
  <div class="meta"><span id="cnt">0 notes</span><span id="act">active 0</span><span id="mch">ch —</span></div>
</div>

<div class="panel">
  <div class="ttl" id="maqTtl">مقام</div>
  <div class="row">
    <div class="field"><label id="lMaq"></label><select id="maqSel"></select></div>
    <div class="field"><label id="lRoot"></label><select id="rootSel"></select></div>
  </div>
  <div class="scale" id="scale"></div>
  <div class="note" id="maqNote"></div>
</div>


<div class="panel">
  <div class="ttl" id="trT"></div>
  <div class="trbox">
    <button class="tb" id="trM12">−12</button>
    <button class="tb" id="trM1">−1</button>
    <div class="trval" id="trBig">0</div>
    <button class="tb" id="trP1">+1</button>
    <button class="tb" id="trP12">+12</button>
    <button class="tb z" id="trZ">0</button>
  </div>
  <div class="note" id="trNote"></div>
</div>
<div class="panel">
  <div class="ttl" id="qtT"></div>
  <div class="qt">
    <div class="qh"><span id="qhL">Normal · All octaves</span><span id="qhR">&lt;no key&gt;</span></div>
    <div class="qb">
      <div class="qkb" id="qkb"></div>
      <div class="qs">
        <button id="bSave" title="save">&#128190;</button>
        <button id="bUndo" title="undo">&#8630;</button>
        <button id="bReset" title="reset all">&#10006;</button>
      </div>
    </div>
    <div class="qr">
      <button data-c="-100">-100</button><button data-c="-50">-50</button><button data-c="-25">-25</button>
      <button data-c="0">0</button>
      <button data-c="25">+25</button><button data-c="50">+50</button><button data-c="100">+100</button>
    </div>
    <div class="qr fine">
      <button data-d="-5">-5</button><button data-d="-1">-1</button>
      <button data-d="1">+1</button><button data-d="5">+5</button>
    </div>
    <div class="qf">
      <span id="tName">Default.Template</span>
      <select id="tSel"><option value="">— templates —</option></select>
    </div>
  </div>
</div>


<div class="panel">
  <div class="ttl" id="devT"></div>
  <div class="row">
    <div class="field"><label id="lDev"></label><select id="dev">
      <option value="casio">Casio WK-7600 / CTK</option>
      <option value="p125">Yamaha P-125 / P-45 (digital piano)</option>
      <option value="psr">Yamaha PSR / Genos</option>
      <option value="korg">Korg PA (oriental)</option>
      <option value="roland">Roland</option>
      <option value="gm">Generic GM module</option>
    </select></div>
    <div class="field"><label id="lSpan"></label><select id="span">
      <option value="16">1–16 (full poly)</option>
      <option value="8">1–8</option>
      <option value="4">1–4</option>
      <option value="1">single channel</option>
    </select></div>
  </div>
  <div class="row" style="margin-top:10px">
    <div class="field"><label id="lWheel"></label><select id="wheel">
      <option value="1">ON</option><option value="0">OFF</option></select></div>
    <div class="field"><label id="lWRange"></label><select id="wrange">
      <option value="1">±1</option><option value="2" selected>±2</option>
      <option value="4">±4</option><option value="7">±7</option><option value="12">±12</option></select></div>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="ghost" id="bAutoLocal">Auto Local-OFF: ON</button>
    <button class="ghost" id="bSetBR"><span id="setBR"></span></button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="ghost" id="bTestCh"><span id="testCh"></span></button>
    <button class="ghost" id="bTestQT"><span id="testQT"></span></button>
    <button class="ghost" id="bReapply"><span id="reapply"></span></button>
  </div>
  <div class="warn info show" id="dinfo" style="margin-top:10px"></div>
</div>

<div class="panel">
  <div class="ttl" id="insT"></div>
  <div class="igrid" id="igrid"></div>
  <div class="note" id="insNote"></div>
</div>
<div class="panel">
  <div class="ttl" id="orgT"></div>
  <div class="row">
    <div class="field"><label id="lCh"></label><select id="dch"></select></div>
    <div class="field"><label id="lVoice"></label><select id="dpg"></select></div>
    <div class="field"><label id="lBank"></label>
      <div style="display:flex;gap:5px"><select id="dbm" style="min-width:0;flex:1"></select><select id="dbl" style="min-width:0;flex:1"></select></div></div>
  </div>
  <div class="sl"><span id="lVol"></span><input type="range" id="c7" min="0" max="127" value="100"><b id="c7v">100</b></div>
  <div class="sl"><span id="lRev"></span><input type="range" id="c91" min="0" max="127" value="40"><b id="c91v">40</b></div>
  <div class="sl"><span id="lCho"></span><input type="range" id="c93" min="0" max="127" value="0"><b id="c93v">0</b></div>
  <div class="sl"><span id="lPan"></span><input type="range" id="c10" min="0" max="127" value="64"><b id="c10v">64</b></div>
  <div class="sl"><span id="lTr"></span><input type="range" id="tr" min="-12" max="12" value="0"><b id="trv">0</b></div>
  <div class="sl"><span id="lOc"></span><input type="range" id="oc" min="-3" max="3" value="0"><b id="ocv">0</b></div>
  <div class="row" style="margin-top:11px">
    <button class="ghost" id="bLocalOff">Local OFF</button>
    <button class="ghost" id="bLocalOn">Local ON</button>
    <button class="red" id="bPanic">PANIC</button>
  </div>
  <div class="row" style="margin-top:9px"><button class="primary" id="bMTS"><span id="mtsBtn"></span></button></div>
  <div class="warn info" id="info" style="margin-top:10px"></div>
</div>


<div class="panel">
  <div class="ttl"><span id="diagT"></span> <span class="badge" id="errBadge" style="display:none">0</span></div>
  <div class="logbox" id="log">ready.</div>
  <div class="row" style="margin-top:9px">
    <button class="ghost" id="bCopy"><span id="copy"></span></button>
    <button class="ghost" id="bClear"><span id="clear"></span></button>
    <button class="ghost" id="bMidiLog">MIDI log: OFF</button>
    <button class="ghost" id="bSelfTest"><span id="selfTest"></span></button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="red" id="bMaster" style="padding:13px"><span id="masterR"></span></button>
  </div>
  <div class="note" id="diagNote"></div>
</div>

<script>
"use strict";

/* ============ DIAGNOSTICS ============ */
const LOG=[];let errCount=0,midiLog=false;
function L(lvl,msg){
  const t=new Date().toISOString().substr(11,12);
  LOG.push({t,lvl,msg});
  if(LOG.length>400)LOG.shift();
  if(lvl==="e"){errCount++;const b=document.getElementById("errBadge");if(b){b.style.display="";b.textContent=errCount;}}
  drawLog();
}
function drawLog(){
  const box=document.getElementById("log");if(!box)return;
  box.innerHTML=LOG.slice(-120).map(x=>'<span class="'+x.lvl+'">'+x.t+' '+
    (x.lvl==="e"?"ERR":x.lvl==="w"?"WRN":x.lvl==="m"?"MID":"INF")+' '+
    String(x.msg).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))+'</span>').join("\n");
  box.scrollTop=box.scrollHeight;
}
window.onerror=function(m,src,ln,col,err){
  L("e","JS "+m+" @"+String(src).split("/").pop()+":"+ln+":"+col+(err&&err.stack?" | "+err.stack.split("\n")[1]:""));
  return false;
};
window.addEventListener("unhandledrejection",e=>L("e","PROMISE "+(e.reason&&e.reason.message||e.reason)));
function guard(name,fn){return function(){try{return fn.apply(this,arguments);}catch(e){L("e",name+"() "+e.message);}};}


/* ============ LANGUAGE ============ */
let lang="ar";
const TXT={
 title:{en:"Maqam Tashreeq Engine",ar:"محرك التشريق"},
 sub:{en:"MIDI controller only — your device plays the sound",ar:"لوحة تحكم MIDI فقط — الصوت يخرج من جهازك"},
 connect:{en:"① Connect MIDI",ar:"① اتصال بـ MIDI"},
 hint0:{en:"Tap Connect, then choose your devices.",ar:"اضغط اتصال ثم اختر الأجهزة."},
 lIn:{en:"MIDI IN · your keyboard",ar:"MIDI IN · الكيبورد"},
 lOut:{en:"MIDI OUT · your device (required)",ar:"MIDI OUT · الأورغ (مطلوب)"},
 lMode:{en:"Tuning mode",ar:"وضع التشريق"},
 lBR:{en:"Bend range",ar:"نطاق البِند"},
 lNames:{en:"Note names",ar:"أسماء النغمات"},
 ksT:{en:"Keyboard + Speaker Mode",ar:"وضع لوحة المفاتيح والسماعة"},
 ksOn:{en:"🎹 Turn ON — device becomes keyboard + speaker only",ar:"🎹 تشغيل الوضع — الجهاز يصبح لوحة مفاتيح وسماعة فقط"},
 ksOff:{en:"⏹ Turn OFF — restore device to normal",ar:"⏹ إيقاف الوضع — الجهاز يرجع طبيعياً"},
 restore:{en:"↩︎ RESTORE DEVICE",ar:"↩︎ إرجاع الجهاز لوضعه الطبيعي"},
 autoR:{en:"Auto-restore: ",ar:"إرجاع تلقائي: "},
 resetTune:{en:"Reset device tuning",ar:"مسح تشريق الجهاز"},
 maqT:{en:"Maqam",ar:"المقام"},
 lMaq:{en:"Maqam",ar:"المقام"},
 lRoot:{en:"Root key",ar:"القرار"},
 qtT:{en:"Q.T. Tashreeq — manual tuning",ar:"التشريق اليدوي"},
 devT:{en:"Device Setup",ar:"إعداد الجهاز"},
 lDev:{en:"Device preset",ar:"نوع الجهاز"},
 lSpan:{en:"Bend channels",ar:"قنوات البِند"},
 setBR:{en:"Set bend range on device",ar:"ضبط نطاق البِند بالجهاز"},
 testCh:{en:"Test channels",ar:"اختبار القنوات"},
 testQT:{en:"Test tashreeq (A/B)",ar:"اختبار التشريق (A/B)"},
 orgT:{en:"Device Control",ar:"تحكم الجهاز"},
 lCh:{en:"Channel",ar:"القناة"},
 lVoice:{en:"Voice (Program)",ar:"الصوت"},
 lBank:{en:"Bank M / L",ar:"البنك M / L"},
 lVol:{en:"Volume CC7",ar:"الفوليوم CC7"},
 lRev:{en:"Reverb CC91",ar:"الريفيرب CC91"},
 lCho:{en:"Chorus CC93",ar:"الكوراس CC93"},
 lPan:{en:"Pan CC10",ar:"البان CC10"},
 lTr:{en:"Transpose",ar:"ترانسبوز"},
 lOc:{en:"Octave",ar:"أوكتاف"},
 mts:{en:"♩ Send tuning into device (MTS)",ar:"♩ إرسال التشريق داخل الجهاز (MTS)"},
 diagT:{en:"Diagnostics",ar:"صفحة الأخطاء"},
 copy:{en:"📋 Copy report",ar:"📋 نسخ التقرير"},
 clear:{en:"Clear",ar:"مسح"},
 selfTest:{en:"Self test",ar:"فحص ذاتي"},
 diagNote:{en:"If something goes wrong: tap <b>Copy report</b> and paste it in the chat.",ar:"إذا واجهتك مشكلة: اضغط <b>نسخ التقرير</b> والصقه في المحادثة."},
 waiting:{en:"waiting for notes…",ar:"في انتظار النوتات…"},
 noOut:{en:"⚠️ No <b>MIDI OUT</b> selected. This app makes no sound by itself — pick your device or you will hear nothing.",
        ar:"⚠️ لا يوجد <b>MIDI OUT</b>. التطبيق لا يصدر صوتاً بنفسه — اختر جهازك وإلا لن تسمع شيئاً."},

let maqIdx=0, rootPc=0;
let cents=new Array(12).fill(0);   // tashreeq table per pitch-class (absolute)
let undoS=[];

let manualEdit=false;
function applyMaqam(force){
  if(manualEdit && !force){
    if(!confirm(T("askOverwrite"))){ return false; }
  }
  const M=MAQAMAT[maqIdx];
  cents=new Array(12).fill(0);
  M.d.forEach(([s,c])=>{ if(c) cents[((rootPc+s)%12+12)%12]=c; });
  manualEdit=false; undoS.push([...cents]);
  L("i","maqam applied: "+M.en+" root "+nm(rootPc));
  return true;
}
const centsOf=m=>cents[((m%12)+12)%12];

/* ============ MIDI ============ */
let access=null,sysexOK=false,inPort=null,outPort=null;
/* iOS "Web MIDI Browser" ships an older spec shim where inputs/outputs are
   arrays or functions instead of Maps — normalise all three shapes. */
function portArr(kind){
  if(!access)return [];
  let c=access[kind];
  if(typeof c==="function"){try{c=access[kind]();}catch(e){return [];}}
  if(!c)return [];
  if(typeof c.forEach==="function"&&typeof c.size==="number"){const a=[];c.forEach(p=>a.push(p));return a;}
  if(Array.isArray(c))return c.slice();
  if(typeof c.length==="number")return Array.prototype.slice.call(c);
  const a=[];try{c.forEach(p=>a.push(p));}catch(e){}
  return a;
}
function portGet(kind,id){
  const c=access&&access[kind];
  if(c&&typeof c.get==="function"){const p=c.get(id);if(p)return p;}
  return portArr(kind).find(p=>String(p.id)===String(id))||null;
}
let mode="bend",bendRange=2,dch=0,transpose=0,octave=0;

function el(i){return document.getElementById(i);}
function stat(on,t){el("dot").classList.toggle("on",on);el("msg").textContent=t;}
function tx(b){ if(!outPort){if(midiLog)L("w","tx blocked: no MIDI OUT");return false;}
  try{outPort.send(b); if(midiLog)L("m","tx "+b.slice(0,4).map(x=>x.toString(16).padStart(2,"0")).join(" ")+(b.length>4?" …"+b.length:"")); return true;}
  catch(e){L("e","tx failed: "+e.message);return false;} }

function resetPool(){
  pool = (mode==="bend") ? (typeof spanList==="function"?spanList().slice():[dch]) : [dch];
  if(mode==="bend"){
    pool.forEach(ch=>{
      tx([0xB0|ch,101,0]);tx([0xB0|ch,100,0]);
      tx([0xB0|ch,6,bendRange]);tx([0xB0|ch,38,0]);
      tx([0xB0|ch,101,127]);tx([0xB0|ch,100,127]);
      tx([0xE0|ch,0,64]);
    });
  }
}

const wheelCents=()=> wheelOn ? (wheelRaw/8192)*wheelRange*100 : 0;
function needRange(){ return wheelOn ? Math.min(12,wheelRange+1) : 2; }
function sendBend(ch,c){const v=bendVal(c);tx([0xE0|ch,v&0x7f,(v>>7)&0x7f]);}
function refreshBends(){
  const w=wheelCents();
  held.forEach(h=>sendBend(h.ch, centsOf(h.n)+w));
  if(mode==="bend")pool.forEach(ch=>sendBend(ch,w));   // idle channels ready for next note
}
function setWheel(raw){
  wheelRaw=Math.max(-8192,Math.min(8191,raw));
  if(!wheelOn){ if(mode!=="bend")tx([0xE0|dch,(wheelRaw+8192)&0x7f,((wheelRaw+8192)>>7)&0x7f]); return; }
  refreshBends();
}
let brWarned=false;
function bendVal(c){
  if(Math.abs(c)>bendRange*100){
    if(!brWarned){brWarned=true;L("w","cents "+c+" exceeds bend range ±"+(bendRange*100)+" — raise Bend range");}
    c=Math.sign(c)*bendRange*100;
  }
  const v=Math.round(8192+(c/(bendRange*100))*8192);
  return Math.max(0,Math.min(16383,v));
}
function noteOn(src,vel){
  const n=Math.max(0,Math.min(127,src+transpose+octave*12));
  if(held.has(src))noteOff(src);
  let ch;
  if(mode==="bend"){
    ch = pool.length ? pool.shift() : dch;
    sendBend(ch, centsOf(n)+wheelCents());
  } else { ch=dch; if(wheelOn)sendBend(ch,wheelCents()); }
  tx([0x90|ch,n,vel]);
  held.set(src,{n,ch});
  count++; show(n,vel,ch); upd(); if(typeof armIdle==="function")armIdle();
}
function noteOff(src){
  const h=held.get(src); if(!h)return;
  tx([0x80|h.ch,h.n,0]);
  held.delete(src);
  if(mode==="bend"&&pool.indexOf(h.ch)<0)pool.push(h.ch);
  upd();
}
function panic(){
  held.clear(); wheelRaw=0;
  for(let ch=0;ch<16;ch++){tx([0xB0|ch,64,0]);tx([0xB0|ch,123,0]);tx([0xB0|ch,120,0]);tx([0xE0|ch,0,64]);}
  resetPool();upd();
}
function upd(){el("act").textContent="active "+held.size;el("cnt").textContent=count+" notes";}
function show(n,vel,ch){
  const c=centsOf(n),mo=el("mon");mo.classList.remove("idle");
  mo.innerHTML=nm(n)+Math.floor(n/12-1)+' <span class="o">'+(c?(c>0?"+":"")+c+"¢":"0¢")+' · vel '+vel+'</span>';
  el("mch").textContent="ch "+(ch+1);
}
function onMidi(e){
  const [st,a,b]=e.data,cmd=st&0xf0;
  if(midiLog)L("m","rx "+Array.from(e.data).slice(0,3).map(x=>x.toString(16).padStart(2,"0")).join(" "));
  if(cmd===0x90&&b>0)noteOn(a,b);
  else if(cmd===0x80||(cmd===0x90&&b===0))noteOff(a);
  else if(cmd===0xB0){
    if(a===123||a===120)panic();
    else if(mode==="bend"){spanList().forEach(ch=>tx([0xB0|ch,a,b]));}
    else tx([0xB0|dch,a,b]);
  }
  else if(cmd===0xE0){ setWheel(((b<<7)|a)-8192); }
  else if(cmd===0xD0){ (mode==="bend"?spanList():[dch]).forEach(ch=>tx([0xD0|ch,a])); }
  else if(cmd===0xA0){ let done=false; held.forEach(h=>{if(h.n===a+transpose+octave*12){tx([0xA0|h.ch,a,b]);done=true;}}); if(!done)tx([0xA0|dch,a,b]); }
}
function bindIn(id){
  if(!access)return;
  portArr("inputs").forEach(p=>p.onmidimessage=null);
  inPort=portGet("inputs",id);
  if(inPort){try{if(inPort.open)inPort.open();}catch(e){}inPort.onmidimessage=onMidi;}
}
function bindOut(id){
  if(typeof restored!=="undefined"&&!restored)restoreDevice(true);
  panic();
  outPort=access?portGet("outputs",id):null;
  if(outPort){try{if(outPort.open)outPort.open();}catch(e){}healOnReconnect();}
  resetPool();checkOut();
  if(outPort&&typeof setBendRangeOnDevice==="function")setBendRangeOnDevice();
}
function checkOut(){
  const w=el("warn");
  if(!outPort){w.className="warn err show";
    w.innerHTML=T("noOut");}
  else w.className="warn err";
}
function refresh(){
  const iS=el("inSel"),oS=el("outSel"),ki=iS.value,ko=oS.value;
  iS.innerHTML='<option value="">—</option>';oS.innerHTML='<option value="">—</option>';
  let ni=0,no=0;
  portArr("inputs").forEach(p=>{ni++;const o=document.createElement("option");o.value=p.id;o.textContent=p.name||("input "+ni);iS.appendChild(o);});
  portArr("outputs").forEach(p=>{no++;const o=document.createElement("option");o.value=p.id;o.textContent=p.name||("output "+no);oS.appendChild(o);});
  iS.value=ki||(ni?iS.options[1].value:"");
  oS.value=ko||(no?oS.options[1].value:"");
  bindIn(iS.value);bindOut(oS.value);
  L("i","ports refreshed — in:"+ni+" out:"+no);
  stat(ni>0&&no>0, "IN: "+(ni?ni:"0")+"  ·  OUT: "+(no?no:"0")+(sysexOK?"  · SysEx ✓":"  · SysEx ✗"));
}
async function connect(){
  if(!window.isSecureContext||!navigator.requestMIDIAccess){
    const w=el("warn");w.className="warn err show";
    w.innerHTML="⚠️ MIDI مغلق: الصفحة ليست <b>https://</b>. Web MIDI لا يعمل من ملف محلي — ارفع التطبيق على استضافة آمنة.";
    stat(false,"Not secure — MIDI unavailable.");return;}
  try{ access=await navigator.requestMIDIAccess({sysex:true}); sysexOK=true; }
  catch(e){ try{ access=await navigator.requestMIDIAccess({sysex:false}); sysexOK=false; }
            catch(e2){ L("e","requestMIDIAccess denied: "+e2.message); stat(false,"تم رفض إذن MIDI."); return; } }
  L("i","MIDI access granted, sysex="+sysexOK);
  setTimeout(()=>{try{healOnReconnect();}catch(e){}},300);
  try{access.onstatechange=(ev)=>{
    if(ev&&ev.port&&ev.port.type==="output"&&ev.port.state==="disconnected"){
      held.clear();ksOn=false;restored=true;
      el("bKS").textContent=T("ksOn");
      L("w","output disconnected: "+ev.port.name);
      if(isUnsafe())showStuck(true);
      ksMsg(T("disc"));
    }
    refresh();
  };}catch(e){L("w","onstatechange unsupported (old shim)");}
  refresh();
}
/* MTS bulk tuning dump */
function sendMTS(){
  const i=el("info");
  if(!outPort){i.className="warn info show";i.textContent="اختر MIDI OUT أولاً.";return;}
  if(!sysexOK){i.className="warn info show";i.textContent="SysEx غير مسموح — امنح إذن MIDI الكامل على رابط https.";return;}
  const d=[0xF0,0x7F,0x7F,0x08,0x02,0x00,127];
  for(let m=0;m<128;m++){
    const t=m+centsOf(m)/100;
    let base=Math.floor(t),f=t-base;
    if(base<0){base=0;f=0;} if(base>127){base=127;f=0;}
    const v=Math.max(0,Math.min(16383,Math.round(f*16384)));
    d.push(m,base,(v>>7)&0x7f,v&0x7f);
  }
  d.push(0xF7);
  i.className="warn info show";
  L("i","MTS dump sent, "+d.length+" bytes");
  i.innerHTML = tx(d)
   ? "✅ أُرسل جدول تشريق كامل (128 نغمة) إلى الجهاز.<br>إن لم يتغيّر شيء فجهازك لا يدعم MTS — ارجع لوضع <b>Pitch-Bend</b>."
   : "❌ فشل الإرسال.";
}

/* ============ SAFETY ENGINE ============ */
/* الجهاز لا يُترك أبداً في حالة غير طبيعية. */
let ksOn=false, autoRestore=true, idleTimer=null, restored=true;
const DEFAULT_BR=2;

function forAllCh(fn){ for(let c=0;c<16;c++) fn(c); }

function enterKS(){                       // keyboard + speaker mode
  if(!outPort){ksMsg(T("needOut"));return;}
  forAllCh(c=>{
    tx([0xB0|c,123,0]);                   // all notes off
    tx([0xE0|c,0,64]);                    // bend center
    tx([0xB0|c,101,0]);tx([0xB0|c,100,0]);
    tx([0xB0|c,6,bendRange]);tx([0xB0|c,38,0]);
    tx([0xB0|c,101,127]);tx([0xB0|c,100,127]);
    tx([0xB0|c,122,0]);                   // LOCAL OFF
  });
  if(typeof sendProg==="function")sendProg();
  markUnsafe(true);
  ksOn=true;restored=false;L("i","KS mode ON (local off sent, bendRange ±"+bendRange+")");
  el("bKS").textContent=T("ksOff");
  ksMsg(T("ksDone"));
  armIdle();
}
function restoreDevice(quiet){
  if(outPort){
    forAllCh(c=>{
      tx([0xB0|c,64,0]);                  // sustain off
      tx([0xB0|c,123,0]);                 // all notes off
      tx([0xB0|c,120,0]);                 // all sound off
      tx([0xE0|c,0,64]);                  // bend center
      tx([0xB0|c,101,0]);tx([0xB0|c,100,0]);
      tx([0xB0|c,6,DEFAULT_BR]);tx([0xB0|c,38,0]);   // bend range back to factory 2
      tx([0xB0|c,101,127]);tx([0xB0|c,100,127]);     // RPN null
      tx([0xB0|c,121,0]);                 // reset all controllers
      tx([0xB0|c,7,100]);                 // volume default
      tx([0xB0|c,10,64]);                 // pan center
      tx([0xB0|c,122,127]);               // LOCAL ON  ← الأهم
    });
  }
  markUnsafe(false);showStuck(false);
  held.clear();ksOn=false;restored=true;upd();L("i","device restored (local on, bend ±2, controllers reset)");
  el("bKS").textContent=T("ksOn");
  ["c7","c91","c93","c10"].forEach((id,i)=>{const v=[100,40,0,64][i];const e=el(id);if(e){e.value=v;el(id+"v").textContent=v;}});
  if(!quiet)ksMsg(T("restored"));
  clearTimeout(idleTimer);
}
function resetDeviceTuning(){             // flat / equal-temperament MTS
  if(!outPort||!sysexOK){ksMsg(T("needSysex"));return;}
  const d=[0xF0,0x7F,0x7F,0x08,0x02,0x00,127];
  for(let m=0;m<128;m++)d.push(m,m,0,0);
  d.push(0xF7);tx(d);
  ksMsg(T("tuneReset"));
}
function ksMsg(h){el("ksinfo").innerHTML=h;}
function armIdle(){
  clearTimeout(idleTimer);
  if(!autoRestore||!ksOn)return;
  idleTimer=setTimeout(()=>{ if(ksOn){restoreDevice(true);
    ksMsg(T("idleR"));}},300000);
}

window.addEventListener("pagehide",safeExit);

  "channel   : "+(dch+1)+"   transpose: "+transpose+"   octave: "+octave,
  "ks mode   : "+ksOn+"   autoRestore: "+autoRestore+"   restored: "+restored,
  "maqam     : "+M.en+" / "+M.ar+"   root: "+nm(rootPc)+" ("+rootPc+")",

  "pool      : ["+pool.join(",")+"]   held: "+held.size+"   notes: "+count,
  "errors    : "+errCount,

  LOG.slice(-120).map(x=>x.t+" "+x.lvl.toUpperCase()+" "+x.msg).join("\n"),

}

/* ============ UNPLUG SAFETY ============ */
/* Once the port is gone we can no longer send Local-ON, so:
   1) mark an "unsafe" flag the moment the device engine is muted,
   2) clear it only after a confirmed restore,
   3) on any later launch/reconnect, restore first thing. */
const FLAG="qt_local_off";
function markUnsafe(on){
  try{ on?localStorage.setItem(FLAG,String(Date.now())):localStorage.removeItem(FLAG); }catch(e){}
  window.__qtUnsafe=on;
}
function isUnsafe(){ try{ return !!localStorage.getItem(FLAG); }catch(e){ return !!window.__qtUnsafe; } }
function showStuck(show){
  const b=el("stuck"); if(!b)return;
  b.style.display=show?"block":"none";
  if(show)b.innerHTML=T("stuckMsg");
}
function healOnReconnect(){
  if(!outPort||!isUnsafe())return;
  for(let c=0;c<16;c++)tx([0xB0|c,122,127]);   // LOCAL ON, immediately
  markUnsafe(false); showStuck(false);
  L("i","auto-heal: Local ON re-sent after reconnect");
  ksMsg(T("healed"));
}
function safeUnplug(){
  if(!outPort){ ksMsg(T("noPortUnplug")); markUnsafe(false); showStuck(false); return; }
  restoreDevice(true);
  markUnsafe(false); showStuck(false);
  ksMsg(T("safeNow"));
  L("i","safe-unplug: device restored, cable can be removed");
}
/* watchdog: some platforms (iOS shim) never fire onstatechange */
let lastOutIds="";
setInterval(()=>{
  if(!access)return;
  const ids=portArr("outputs").map(p=>p.id).join("|");
  if(ids===lastOutIds)return;
  const had=lastOutIds; lastOutIds=ids;
  if(!had)return;
  const stillThere=outPort&&ids.split("|").indexOf(String(outPort.id))>=0;
  if(outPort&&!stillThere){
    L("w","output vanished (polled) — cannot send Local ON any more");
    held.clear(); ksOn=false; upd();
    el("bKS").textContent=T("ksOn");
    if(isUnsafe())showStuck(true);
    refresh();
  } else if(ids.length>had.length){
    L("i","new output detected"); refresh(); healOnReconnect();
  }
},2000);

/* ============ PLATFORM SUPPORT ============ */
function platform(){
  const ua=navigator.userAgent, iOS=/iPad|iPhone|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  const android=/Android/.test(ua);
  const hasMIDI=!!navigator.requestMIDIAccess;
  const shim=hasMIDI&&iOS;
  return {iOS,android,hasMIDI,shim,secure:window.isSecureContext};
}
function showPlatform(){
  const p=platform(),m=el("platMsg");
  let k;
  if(p.hasMIDI&&p.secure) k = p.shim?"pOKios":(p.android?"pOKand":"pOKdesk");
  else if(p.iOS) k="pIOS";
  else if(!p.secure) k="pNotSecure";
  else k="pNoMIDI";
  m.className="warn "+(k.startsWith("pOK")?"info":"err")+" show";
  m.innerHTML=T(k);
  L("i","platform: "+(p.iOS?"iOS":p.android?"Android":"desktop")+" midi="+p.hasMIDI+" shim="+p.shim+" secure="+p.secure);
}

/* ============ TRANSPOSE (semitones, applied to outgoing notes) ============ */
function setTranspose(v,rel){
  panic();
  transpose=Math.max(-24,Math.min(24,rel?transpose+v:v));
  const sl=el("tr"); if(sl){ sl.value=Math.max(-12,Math.min(12,transpose)); el("trv").textContent=(transpose>0?"+":"")+transpose; }
  el("trBig").textContent=(transpose>0?"+":"")+transpose;
  const total=transpose+octave*12;
  el("trNote").innerHTML=T("trNote").replace("%s",(total>0?"+":"")+total)
    .replace("%k",nm(rootPc)).replace("%r",nm(rootPc+total));
  L("i","transpose="+transpose+" octave="+octave+" total="+total);
}
